# Copy to romm-assist-secret.yaml (gitignored) and fill in real values,
# then: kubectl apply -f romm-assist-secret.yaml
#       podman kube play romm-assist-secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: romm-assist-env
type: Opaque
stringData:
  ROMM_BASE_URL: http://localhost:8080
  ROMM_API_TOKEN: rmm_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
  # Alternative to the token above: basic auth credentials
  # ROMM_USERNAME: admin
  # ROMM_PASSWORD: changeme
