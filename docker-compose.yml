services:
  romm-assist:
    build: .
    image: ghcr.io/zeldafan3421/romm-assist:latest
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: unless-stopped

  # Optional local LLM backend, powered by llama.cpp's OpenAI-compatible
  # server. Off by default; start it explicitly with:
  #   docker compose --profile llm up -d
  # See README.md#optional-local-llm-llamacpp for how to point Open WebUI
  # (or any OpenAI-API client) at it, and how to also register romm-assist
  # itself as an Open WebUI OpenAPI tool server.
  llamacpp:
    image: ghcr.io/ggml-org/llama.cpp:server
    profiles: ["llm"]
    command: ["--jinja"] # enables chat templates that support tool calling
    ports:
      - "${LLAMACPP_PORT:-8080}:8080"
    volumes:
      - llamacpp-models:/models
    environment:
      LLAMA_CACHE: /models
      LLAMA_ARG_HF_REPO: ${LLAMACPP_HF_REPO:-Qwen/Qwen2.5-1.5B-Instruct-GGUF}
      LLAMA_ARG_HF_FILE: ${LLAMACPP_HF_FILE:-qwen2.5-1.5b-instruct-q4_k_m.gguf}
      LLAMA_ARG_CTX_SIZE: ${LLAMACPP_CTX_SIZE:-4096}
      LLAMA_ARG_THREADS: ${LLAMACPP_THREADS:-4}
      LLAMA_ARG_N_GPU_LAYERS: ${LLAMACPP_N_GPU_LAYERS:-0}
      LLAMA_ARG_HOST: 0.0.0.0
      LLAMA_ARG_PORT: 8080
      LLAMA_API_KEY: ${LLAMACPP_API_KEY:-}
    restart: unless-stopped

volumes:
  llamacpp-models:
