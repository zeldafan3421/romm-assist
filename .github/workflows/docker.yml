name: Docker

on:
  push:
    branches: ["**"]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -e ".[dev]"

      - run: pytest -q

      - name: Validate compose files (base, and base + llm add-on)
        run: |
          cp .env.example .env
          docker compose config -q
          docker compose -f docker-compose.yml -f docker-compose.llm.yml config -q

      - name: Validate Kubernetes manifests
        run: python k8s/validate.py

  podman-build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image with Podman
        run: podman build -t ghcr.io/zeldafan3421/romm-assist:latest .

      - name: Smoke-test the Deployment with rootless podman kube play
        run: |
          { cat k8s/romm-assist-secret.example.yaml; echo ---; cat k8s/romm-assist-deployment.yaml; } | podman kube play -
          ok=""
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health; then
              ok=1
              break
            fi
            sleep 2
          done
          echo
          if [ -z "$ok" ]; then
            echo "romm-assist did not become healthy under podman kube play in time"
            podman ps -a
            podman pod ps
            exit 1
          fi
          echo "romm-assist is healthy under podman kube play"

      - name: Tear down kube play resources
        if: always()
        run: |
          { cat k8s/romm-assist-secret.example.yaml; echo ---; cat k8s/romm-assist-deployment.yaml; } | podman kube down - || true

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Decide whether to push the image
        id: push
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "value=false" >> "$GITHUB_OUTPUT"
          else
            echo "value=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        if: steps.push.outputs.value == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ steps.push.outputs.value == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
