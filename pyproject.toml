[project]
name = "romm-assist"
version = "0.1.0"
description = "OpenAPI tool server for agentic RomM game-library management."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[project.scripts]
romm-assist = "romm_assist.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/romm_assist"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
